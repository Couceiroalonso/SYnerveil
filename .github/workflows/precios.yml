name: Actualizar precios

# Cada lunes (y cuando lo lances a mano desde Actions) pone en cards.json el precio más barato de cada carta
# entre todas sus ediciones de papel, con datos de Scryfall (Cardmarket en euros y TCGplayer en dólares).
# Al guardar el cambio, Vercel publica la web otra vez sola.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths: [".github/workflows/precios.yml"]

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Precios más baratos de Scryfall
        shell: python
        run: |
          import json, urllib.request, gzip, io, os
          H = {"User-Agent": "SynerveilPrices/1.0", "Accept": "application/json"}
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=120)
          # the bulk file's address: straight from the list, or asking for that item, or Scryfall's direct link
          bulk = json.load(get("https://api.scryfall.com/bulk-data"))["data"]
          item = next((b for b in bulk if b.get("type") == "default_cards"), {})
          print("bulk item keys:", sorted(item.keys()))
          uri = item.get("jsonl_download_uri") or item.get("download_uri")
          if not uri and item.get("uri"):
              uri = json.load(get(item["uri"])).get("download_uri")
          if not uri:
              uri = "https://api.scryfall.com/bulk-data/default-cards?format=file"
          print("descargando", uri)
          best = {}
          prints, sets = {}, {}
          with get(uri) as resp:
              # one card per line (JSON Lines, or the classic array written one card per line), compressed or not
              raw = io.BufferedReader(resp)
              f = gzip.GzipFile(fileobj=raw) if raw.peek(2)[:2] == b"\x1f\x8b" else raw
              def cards():
                  for line in io.TextIOWrapper(f, encoding="utf-8"):
                      line = line.strip().rstrip(",")
                      if line.startswith("{"):
                          yield json.loads(line)
              for c in cards():
                  if c.get("digital") or "paper" not in (c.get("games") or []):
                      continue
                  p = c.get("prices") or {}
                  def num(*keys):
                      vals = [float(p[k]) for k in keys if p.get(k)]
                      return min(vals) if vals else None
                  eur, usd = num("eur", "eur_foil"), num("usd", "usd_foil", "usd_etched")
                  # every printing with its own price, normal and foil (for the collection's editions)
                  rnd = lambda k: round(float(p[k]), 2) if p.get(k) else None
                  sets.setdefault(c["set"], [c.get("set_name", ""), c.get("released_at", "")])
                  prints.setdefault(c["name"], []).append([c["set"], c.get("collector_number", ""), rnd("eur"), rnd("eur_foil"), rnd("usd"), rnd("usd_foil") or rnd("usd_etched"),
                                                           1 if c.get("nonfoil", True) else 0, 1 if c.get("foil") or c.get("etched") or "etched" in (c.get("finishes") or []) else 0, c.get("released_at", "")])
                  for name in {c["name"], c["name"].split(" // ")[0]}:
                      b = best.setdefault(name, [None, None])
                      if eur is not None and (b[0] is None or eur < b[0]): b[0] = eur
                      if usd is not None and (b[1] is None or usd < b[1]): b[1] = usd
          rows = json.load(open("cards.json", encoding="utf-8"))
          changed = 0
          for r in rows:
              b = best.get(r[0]) or best.get(r[0].split(" // ")[0])
              if not b: continue
              eur = round(b[0], 2) if b[0] is not None else r[8]
              usd = round(b[1], 2) if b[1] is not None else r[9]
              if (eur, usd) != (r[8], r[9]): r[8], r[9] = eur, usd; changed += 1
          json.dump(rows, open("cards.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          for n in prints:
              prints[n].sort(key=lambda x: x[8], reverse=True)
              for x in prints[n]: x.pop()
          json.dump({"sets": sets, "cards": prints}, open("prints.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("ediciones:", sum(len(v) for v in prints.values()), "de", len(prints), "cartas")
          print("precios cambiados:", changed, "de", len(rows))
      - name: Guardar
        run: |
          git config user.name "synerveil-bot"
          git config user.email "synerveil-bot@users.noreply.github.com"
          git add cards.json prints.json
          git diff --cached --quiet || git commit -m "Precios actualizados"
          git pull --rebase
          git push
