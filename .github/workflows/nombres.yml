name: Nombres en español

# Crea es.json con el nombre en español de cada carta que tenga edición en español,
# para que en Synerveil se pueda buscar y pegar listas en español. Se repite el día 1 de cada mes.
on:
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/nombres.yml"]

permissions:
  contents: write

jobs:
  nombres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Nombres en español de Scryfall
        shell: python
        run: |
          import json, urllib.request, gzip, io
          H = {"User-Agent": "SynerveilNames/1.0", "Accept": "application/json"}
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=300)
          # the bulk file's address: straight from the list, or asking for that item, or Scryfall's direct link
          bulk = json.load(get("https://api.scryfall.com/bulk-data"))["data"]
          item = next((b for b in bulk if b.get("type") == "all_cards"), {})
          print("bulk item keys:", sorted(item.keys()))
          uri = item.get("jsonl_download_uri") or item.get("download_uri")
          if not uri and item.get("uri"):
              uri = json.load(get(item["uri"])).get("download_uri")
          if not uri:
              uri = "https://api.scryfall.com/bulk-data/all-cards?format=file"
          print("descargando", uri)
          es = {}
          with get(uri) as resp:
              # one card per line (JSON Lines, or the classic array written one card per line), compressed or not
              raw = io.BufferedReader(resp)
              f = gzip.GzipFile(fileobj=raw) if raw.peek(2)[:2] == b"\x1f\x8b" else raw
              def cards():
                  for line in io.TextIOWrapper(f, encoding="utf-8"):
                      line = line.strip().rstrip(",")
                      if line.startswith("{"):
                          yield json.loads(line)
              for c in cards():
                  if c.get("lang") != "es":
                      continue
                  en = c.get("name")
                  pairs = [(c.get("printed_name"), en)]
                  for face in c.get("card_faces") or []:
                      pairs.append((face.get("printed_name"), face.get("name")))
                  for n, e in pairs:
                      if n and e and n != e and n not in es:
                          es[n] = e
          json.dump(es, open("es.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"), sort_keys=True)
          print("nombres en español:", len(es))
      - name: Guardar
        run: |
          git config user.name "synerveil-bot"
          git config user.email "synerveil-bot@users.noreply.github.com"
          git add es.json
          git diff --cached --quiet || git commit -m "Nombres en español"
          git pull --rebase
          git push
